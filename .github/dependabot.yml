version: 2
updates:
  # Follow the published Didit packages: one grouped pull request a day when
  # any @didit-protocol/* package has a new version. Nothing else is updated.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 2
    allow:
      - dependency-name: "@didit-protocol/*"
    groups:
      didit-packages:
        patterns:
          - "@didit-protocol/*"
